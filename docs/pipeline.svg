<svg xmlns="http://www.w3.org/2000/svg" width="680" height="634" viewBox="0 0 680 634" role="img" aria-labelledby="title desc">
<title id="title">Pipeline de indexado de Layer Library</title>
<desc id="desc">Las carpetas vigiladas entran en un pipeline de cuatro etapas encadenadas: scanner recorre y registra los cambios, hasher calcula la huella sha256 del contenido, thumbnailer saca la PNG del slicer o renderiza en 3D, y metadata extrae tiempo, gramos y colores. El resultado se guarda en library.db, una base SQLite con FTS5. Aparte, watcher.ts vigila el disco con chokidar y reencola en el hasher todo lo que cambia.</desc>
<style>
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; }
  .gray-t { fill: #444441; } .gray-s { fill: #5F5E5A; }
  .purple-t { fill: #3C3489; }
  .teal-t { fill: #085041; } .teal-s { fill: #0F6E56; }
  .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="110" y="30" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th gray-t" x="250" y="48" text-anchor="middle" dominant-baseline="central">Carpetas vigiladas</text>
<text class="ts gray-s" x="250" y="66" text-anchor="middle" dominant-baseline="central">local, USB o NAS</text>

<line x1="250" y1="90" x2="250" y2="122" class="arr" marker-end="url(#arrow)"/>

<rect x="90" y="126" width="320" height="388" rx="20" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th purple-t" x="250" y="152" text-anchor="middle" dominant-baseline="central">Pipeline de indexado</text>

<rect x="110" y="168" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th teal-t" x="250" y="186" text-anchor="middle" dominant-baseline="central">scanner.ts</text>
<text class="ts teal-s" x="250" y="204" text-anchor="middle" dominant-baseline="central">recorre y registra cambios</text>

<line x1="250" y1="228" x2="250" y2="254" class="arr" marker-end="url(#arrow)"/>

<rect x="110" y="258" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th teal-t" x="250" y="276" text-anchor="middle" dominant-baseline="central">hasher.ts</text>
<text class="ts teal-s" x="250" y="294" text-anchor="middle" dominant-baseline="central">huella sha256 del contenido</text>

<line x1="250" y1="318" x2="250" y2="344" class="arr" marker-end="url(#arrow)"/>

<rect x="110" y="348" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th teal-t" x="250" y="366" text-anchor="middle" dominant-baseline="central">thumbnailer.ts</text>
<text class="ts teal-s" x="250" y="384" text-anchor="middle" dominant-baseline="central">PNG del slicer o render 3D</text>

<line x1="250" y1="408" x2="250" y2="434" class="arr" marker-end="url(#arrow)"/>

<rect x="110" y="438" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th teal-t" x="250" y="456" text-anchor="middle" dominant-baseline="central">metadata.ts</text>
<text class="ts teal-s" x="250" y="474" text-anchor="middle" dominant-baseline="central">tiempo, gramos y colores</text>

<rect x="450" y="258" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th gray-t" x="540" y="276" text-anchor="middle" dominant-baseline="central">watcher.ts</text>
<text class="ts gray-s" x="540" y="294" text-anchor="middle" dominant-baseline="central">reencola lo que cambia</text>

<line x1="446" y1="286" x2="394" y2="286" class="arr" marker-end="url(#arrow)"/>

<line x1="250" y1="518" x2="250" y2="544" class="arr" marker-end="url(#arrow)"/>

<rect x="110" y="548" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th gray-t" x="250" y="566" text-anchor="middle" dominant-baseline="central">library.db</text>
<text class="ts gray-s" x="250" y="584" text-anchor="middle" dominant-baseline="central">SQLite + FTS5</text>
</svg>
