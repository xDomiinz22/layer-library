<svg xmlns="http://www.w3.org/2000/svg" width="680" height="680" viewBox="0 0 680 680" role="img" aria-labelledby="title desc">
<title id="title">Flujo de uso de Layer Library</title>
<desc id="desc">Recorrido de un archivo por la app: se añade una carpeta, el pipeline de cuatro etapas lo indexa solo, aparece en la biblioteca buscable y desde ahí se organiza en duplicados, cola de impresión o colecciones. Si a un archivo le faltan tiempo o gramos, un relaminado bajo demanda con Bambu Studio los recalcula antes de mandar el G-code a la impresora.</desc>
<style>
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; }
  .gray-t { fill: #444441; } .gray-s { fill: #5F5E5A; }
  .purple-t { fill: #3C3489; } .purple-s { fill: #534AB7; }
  .teal-t { fill: #085041; } .teal-s { fill: #0F6E56; }
  .coral-t { fill: #712B13; } .coral-s { fill: #993C1D; }
  .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="190" y="30" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th gray-t" x="340" y="48" text-anchor="middle" dominant-baseline="central">Añadir carpeta</text>
<text class="ts gray-s" x="340" y="66" text-anchor="middle" dominant-baseline="central">local, USB o NAS</text>

<line x1="340" y1="86" x2="340" y2="122" class="arr" marker-end="url(#arrow)"/>

<rect x="40" y="126" width="600" height="140" rx="20" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th purple-t" x="340" y="152" text-anchor="middle" dominant-baseline="central">Indexado automático</text>
<text class="ts purple-s" x="340" y="170" text-anchor="middle" dominant-baseline="central">detalle de las cuatro etapas en pipeline.svg</text>

<rect x="160" y="188" width="360" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th teal-t" x="340" y="206" text-anchor="middle" dominant-baseline="central">scanner → hasher → miniatura → metadatos</text>
<text class="ts teal-s" x="340" y="224" text-anchor="middle" dominant-baseline="central">cuatro etapas encadenadas, sin intervención</text>

<line x1="340" y1="266" x2="340" y2="298" class="arr" marker-end="url(#arrow)"/>

<rect x="140" y="302" width="400" height="78" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th coral-t" x="340" y="326" text-anchor="middle" dominant-baseline="central">Biblioteca</text>
<text class="ts coral-s" x="340" y="348" text-anchor="middle" dominant-baseline="central">búsqueda instantánea y filtros</text>
<text class="ts coral-s" x="340" y="368" text-anchor="middle" dominant-baseline="central">rejilla virtualizada con miniaturas</text>

<line x1="220" y1="380" x2="148" y2="406" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="380" x2="340" y2="406" class="arr" marker-end="url(#arrow)"/>
<line x1="460" y1="380" x2="532" y2="406" class="arr" marker-end="url(#arrow)"/>

<rect x="60" y="410" width="176" height="78" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th coral-t" x="148" y="434" text-anchor="middle" dominant-baseline="central">Duplicados</text>
<text class="ts coral-s" x="148" y="456" text-anchor="middle" dominant-baseline="central">agrupados por huella</text>
<text class="ts coral-s" x="148" y="476" text-anchor="middle" dominant-baseline="central">borrado a la papelera</text>

<rect x="252" y="410" width="176" height="78" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th coral-t" x="340" y="434" text-anchor="middle" dominant-baseline="central">Cola de impresión</text>
<text class="ts coral-s" x="340" y="456" text-anchor="middle" dominant-baseline="central">por impresora</text>
<text class="ts coral-s" x="340" y="476" text-anchor="middle" dominant-baseline="central">ordenar y priorizar</text>

<rect x="444" y="410" width="176" height="78" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th coral-t" x="532" y="434" text-anchor="middle" dominant-baseline="central">Colecciones</text>
<text class="ts coral-s" x="532" y="456" text-anchor="middle" dominant-baseline="central">por creador o etiqueta</text>
<text class="ts coral-s" x="532" y="476" text-anchor="middle" dominant-baseline="central">organiza favoritos</text>

<line x1="340" y1="488" x2="340" y2="514" class="arr" marker-end="url(#arrow)"/>

<rect x="190" y="518" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th teal-t" x="340" y="536" text-anchor="middle" dominant-baseline="central">Relaminado</text>
<text class="ts teal-s" x="340" y="554" text-anchor="middle" dominant-baseline="central">bajo demanda, si faltan tiempo o gramos</text>

<line x1="340" y1="574" x2="340" y2="600" class="arr" marker-end="url(#arrow)"/>

<rect x="190" y="604" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th gray-t" x="340" y="622" text-anchor="middle" dominant-baseline="central">Impresora</text>
<text class="ts gray-s" x="340" y="640" text-anchor="middle" dominant-baseline="central">envía el G-code final a imprimir</text>
</svg>
