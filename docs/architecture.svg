<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" role="img" aria-labelledby="title desc">
<title id="title">Arquitectura de Layer Library</title>
<desc id="desc">Tres capas de Electron. El proceso principal, en Node, guarda el índice SQLite con FTS5, el pipeline que va del escaneo a los metadatos, y los servicios de duplicados, papelera, cola, relaminado y actualización. El renderer, en React 19, solo pinta: biblioteca, duplicados y colecciones. Entre ambos, preload expone window.api con contextBridge: las llamadas bajan al principal y los eventos suben al renderer.</desc>
<style>
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; }
  .gray-t { fill: #444441; } .gray-s { fill: #5F5E5A; }
  .purple-t { fill: #3C3489; } .purple-s { fill: #534AB7; }
  .teal-t { fill: #085041; } .teal-s { fill: #0F6E56; }
  .coral-t { fill: #712B13; } .coral-s { fill: #993C1D; }
  .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="40" y="30" width="600" height="160" rx="20" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th purple-t" x="340" y="56" text-anchor="middle" dominant-baseline="central">Proceso principal</text>
<text class="ts purple-s" x="340" y="74" text-anchor="middle" dominant-baseline="central">Node · todo lo que toca disco</text>

<rect x="60" y="92" width="176" height="78" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th teal-t" x="148" y="116" text-anchor="middle" dominant-baseline="central">Índice</text>
<text class="ts teal-s" x="148" y="138" text-anchor="middle" dominant-baseline="central">db.ts · node:sqlite</text>
<text class="ts teal-s" x="148" y="158" text-anchor="middle" dominant-baseline="central">FTS5, sin nativos</text>

<rect x="252" y="92" width="176" height="78" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th teal-t" x="340" y="116" text-anchor="middle" dominant-baseline="central">Pipeline</text>
<text class="ts teal-s" x="340" y="138" text-anchor="middle" dominant-baseline="central">scanner → hasher</text>
<text class="ts teal-s" x="340" y="158" text-anchor="middle" dominant-baseline="central">thumbnailer → metadata</text>

<rect x="444" y="92" width="176" height="78" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th teal-t" x="532" y="116" text-anchor="middle" dominant-baseline="central">Servicios</text>
<text class="ts teal-s" x="532" y="138" text-anchor="middle" dominant-baseline="central">duplicados y papelera</text>
<text class="ts teal-s" x="532" y="158" text-anchor="middle" dominant-baseline="central">cola, slicer, updater</text>

<line x1="280" y1="194" x2="280" y2="218" class="arr" marker-end="url(#arrow)"/>
<line x1="400" y1="218" x2="400" y2="194" class="arr" marker-end="url(#arrow)"/>

<rect x="190" y="222" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th gray-t" x="340" y="240" text-anchor="middle" dominant-baseline="central">preload</text>
<text class="ts gray-s" x="340" y="258" text-anchor="middle" dominant-baseline="central">expone window.api con contextBridge</text>

<line x1="280" y1="282" x2="280" y2="306" class="arr" marker-end="url(#arrow)"/>
<line x1="400" y1="306" x2="400" y2="282" class="arr" marker-end="url(#arrow)"/>

<rect x="40" y="310" width="600" height="160" rx="20" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th purple-t" x="340" y="336" text-anchor="middle" dominant-baseline="central">Renderer</text>
<text class="ts purple-s" x="340" y="354" text-anchor="middle" dominant-baseline="central">React 19 · solo pinta</text>

<rect x="60" y="372" width="176" height="78" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th coral-t" x="148" y="396" text-anchor="middle" dominant-baseline="central">Biblioteca</text>
<text class="ts coral-s" x="148" y="418" text-anchor="middle" dominant-baseline="central">rejilla virtualizada</text>
<text class="ts coral-s" x="148" y="438" text-anchor="middle" dominant-baseline="central">y panel de detalle</text>

<rect x="252" y="372" width="176" height="78" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th coral-t" x="340" y="396" text-anchor="middle" dominant-baseline="central">Duplicados</text>
<text class="ts coral-s" x="340" y="418" text-anchor="middle" dominant-baseline="central">agrupados por huella</text>
<text class="ts coral-s" x="340" y="438" text-anchor="middle" dominant-baseline="central">borrado a papelera</text>

<rect x="444" y="372" width="176" height="78" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th coral-t" x="532" y="396" text-anchor="middle" dominant-baseline="central">Colecciones</text>
<text class="ts coral-s" x="532" y="418" text-anchor="middle" dominant-baseline="central">creadores y etiquetas</text>
<text class="ts coral-s" x="532" y="438" text-anchor="middle" dominant-baseline="central">cola por impresora</text>
</svg>
