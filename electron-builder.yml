appId: app.layerlibrary.desktop
productName: Layer Library
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - '!**/*.map'
win:
  target: nsis
  icon: build/icon.ico
  # Nombre de archivo fijo con guión en vez de ${productName} (tiene un
  # espacio, "Layer Library") — ya causó una vez un enlace de descarga roto
  # al no coincidir con lo que alguien esperaba/escribió a mano.
  artifactName: Layer-Library-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # La creación automática y silenciosa se apaga a propósito — la casilla
  # de build/installer.nsh (customFinishPage) es la única vía ahora, para
  # que sea una elección visible en vez de algo que ya pasó sin avisar.
  createDesktopShortcut: false
  shortcutName: Layer Library
  # Sin installerIcon/uninstallerIcon a propósito: al fijar uninstallerIcon,
  # electron-builder añade un paso en tiempo de instalación que extrae
  # "uninstallerIcon.ico" a la carpeta de instalación (installSection.nsh:
  # `File /oname=uninstallerIcon.ico`). En equipos donde ese archivo quedó
  # de una instalación anterior (bloqueado por el shell porque el registro
  # lo usa como DisplayIcon, o marcado de solo lectura) NSIS aborta con
  # "error abriendo archivo para escribir ...uninstallerIcon.ico".
  # Sin estas dos claves, el icono se sigue incrustando en el .exe del
  # instalador y del desinstalador en tiempo de compilación (MUI_ICON /
  # MUI_UNICON caen a `win.icon` = build/icon.ico), sin escribir nada en
  # disco durante la instalación. Mismo resultado visual, sin el fallo.
  include: build/installer.nsh
linux:
  target:
    - AppImage
  icon: build/icon.png
  category: Utility
  artifactName: Layer-Library-${version}.${ext}
publish:
  provider: github
  owner: xDomiinz22
  repo: layer-library
